<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Cover Studio — rebook</title>
<link rel="stylesheet" href="/styles.css"/>
<style>
 .tabs{display:flex;gap:.5em;margin:1em 0 .4em;}
 .tab{padding:.5em 1.1em;border:1px solid #2f3542;border-radius:8px 8px 0 0;background:#12141a;color:#9aa0ac;cursor:pointer;}
 .tab.on{background:#1b1e27;color:#7aa2f7;border-bottom-color:#1b1e27;}
 section{background:#1b1e27;border:1px solid #2f3542;border-radius:0 10px 10px 10px;padding:1em;}
 form{display:flex;flex-wrap:wrap;gap:.6em;align-items:end;}
 label{display:flex;flex-direction:column;font-size:.85em;color:#9aa0ac;}
 input,select{background:#12141a;color:#e6e6e6;border:1px solid #2f3542;border-radius:6px;padding:.4em .6em;font:inherit;}
 input[type=color]{padding:0;height:2.1em;width:3em;}
 button{background:#7aa2f7;color:#12141a;border:0;border-radius:6px;padding:.55em 1.2em;font-weight:bold;cursor:pointer;}
 button.ghost{background:transparent;color:#7aa2f7;border:1px solid #7aa2f7;}
 #canvas{background:#fff;border-radius:8px;overflow:auto;max-width:100%;margin-top:.8em;}
 #canvas svg,#preview svg{max-width:100%;height:auto;display:block;}
 .meta{color:#9aa0ac;font-size:.9em;}
 #preview{background:#fff;border-radius:8px;margin-top:.8em;overflow:auto;}
</style>
</head>
<body>
<!--rbnav-->
<div id="cover-app">
<header>
<h1>Cover Studio</h1>
<p class="author">KDP-шаблони та багатошарова студія обкладинок</p>
</header>
<div class="tabs">
 <button class="tab on" data-tab="gen">Шаблон (guides)</button>
 <button class="tab" data-tab="studio">Студія (шари)</button>
 <span class="grow" style="flex:1"></span><span class="tab" id="langChip" style="cursor:pointer">EN</span>
</div>

<section id="tab-gen">
<form id="f">
 <label>Trim<select id="trim"></select></label>
 <label>Сторінок<input id="pages" type="number" value="300" min="24" max="828" step="2"/></label>
 <label>Папір<select id="paper">
  <option value="white">white</option><option value="cream">cream</option>
  <option value="ground">groundwood</option><option value="premium">premium color</option>
 </select></label>
 <label>Тип<select id="mode">
  <option value="pb">paperback (KDP)</option>
  <option value="hc">hardcover (case laminate)</option>
  <option value="dj">dust jacket (Ingram)</option>
 </select></label>
 <label>ISBN (штрих-код)<input id="isbn" placeholder="978-…-…-…-x" size="20"/></label>
 <button type="submit">Згенерувати</button>
 <a id="dl" hidden download="cover-template.svg"><button type="button">SVG ↓</button></a>
</form>
<p class="meta" id="meta"></p>
<div id="canvas"></div>
</section>

<section id="tab-studio" hidden>
 <form id="sf">
  <label>Чернетка<select id="draftSel"><option value="">— нова —</option></select></label>
  <label>Назва<input id="stitle" size="22"/></label>
  <label>Автор<input id="sauthor" size="16"/></label>
  <label>Формат<select id="smode">
   <option value="ebook">eBook 1600×2560</option>
   <option value="pb" selected>paperback wrap</option>
   <option value="hc">hardcover wrap</option>
   <option value="dj">dust jacket</option>
  </select></label>
  <label>Trim<select id="strim"></select></label>
  <label>Pages<input id="spages" type="number" value="300" min="24" max="828"/></label>
  <label>Front bg<input id="sbg" type="color" value="#1d2733"/></label>
  <label>Back bg<input id="sbg2" type="color" value="#1d2733"/></label>
  <label>Spine bg<input id="sspine" type="color" value="#16202c"/></label>
  <label>Текст корінця<select id="sspinetxt"><option value="on">auto (pages&gt;79)</option><option value="off">вимкнено</option></select></label>
  <label>Обкладинка-картинка<input id="simg" type="file" accept="image/png,image/jpeg,image/webp,image/svg+xml"/></label>
 </form>
 <div class="bar" style="display:flex;gap:.5em;margin-top:.6em;flex-wrap:wrap;">
  <button id="renderBtn">Рендер</button>
  <button id="saveBtn" class="ghost">Зберегти cover.json у чернетку</button>
  <button id="applyBtn" class="ghost">Застосувати переміщення</button>
  <span id="safeBadge" class="meta"></span>
  <button id="svgBtn" class="ghost">SVG ↓</button>
   <button id="pngBtn" class="ghost">PNG ↓</button>
   <label class="meta" style="gap:.2em">PNG×<select id="pngScale" style="padding:.15em .3em"><option value="1">1×</option><option value="2" selected>2×</option><option value="3">3×</option></select></label>
  <span id="layBox" class="meta" style="display:flex;gap:.5em;align-items:center"></span>
  <span id="sstat" class="meta"></span>
 </div>
 <p class="meta">Клік по шару — перетягни мишею; стрілки nudge 1px (Shift 10px); Del — прибрати текст; Esc — зняти вибір.</p>
 <div id="preview"></div>
 <div class="bar" style="margin-top:1em;">
  <button id="v3Btn" class="ghost">🧊 3D-перегляд</button>
  <button id="v3Reset" class="ghost" hidden>скинути кут</button>
  <span id="v3Dims" class="meta"></span>
 </div>
  <div id="stage3d" hidden style="perspective:1600px;background:#0c0f16;border-radius:12px;margin-top:.6em;height:480px;overflow:hidden;position:relative;touch-action:none">
   <div id="book3d" style="position:absolute;left:50%;top:50%;transform-style:preserve-3d"></div>
   <p style="position:absolute;bottom:.5em;width:100%;text-align:center;margin:0" class="muted">тягни / палець — обертати · колесо / pinch — zoom · з фокусу: ←→↑↓ кут, PgUp/PgDn зум, 0 — скинути</p>
  </div>
</section>
</div>
<script>
const $=s=>document.querySelector(s);
(function(){const L={uk:['Шаблон (guides)','Студія (шари)','Полиця','Продукти','Згенерувати','Чернетка','Назва','Автор','Формат','Сторінок','Папір','Тип','ISBN (штрих-код)','Рендер','Зберегти cover.json у чернетку','оберіть чернетку'],
 en:['Template (guides)','Studio (layers)','Shelf','Products','Generate','Draft','Title','Author','Format','Pages','Paper','Kind','ISBN (barcode)','Render','Save cover.json to draft','pick a draft']};
 let lang=localStorage.getItem('rb.lang')||'uk';const keys=document.querySelectorAll('label span,#sstat');
 window._rbLang=()=>lang;
 function apply(){const t=L[lang];document.getElementById('langChip').textContent=lang==='uk'?'EN':'УК';
  const tabs=document.querySelectorAll('.tab[data-tab]');if(tabs[0])tabs[0].textContent=t[0];if(tabs[1])tabs[1].textContent=t[1];}
 document.getElementById('langChip').onclick=()=>{lang=lang==='uk'?'en':'uk';localStorage.setItem('rb.lang',lang);apply();};apply();})();
const TRIMS={pb:["5x8","5.06x7.81","5.25x8","5.5x8.5","6x9","6.14x9.21","6.69x9.61","7x10","7.44x9.69","7.5x9.25","8x10","8.25x6","8.25x8.25","8.27x11.69","8.5x8.5","8.5x11"],
 hc:["5.5x8.5","6x9","6.14x9.21","7x10","8.25x11"], dj:["5x8","5.5x8.5","6x9","7x10"]};
function fill(sel,table,keep){const cur=keep?$( sel).value:'6x9';$(sel).innerHTML=table.map(t=>'<option'+(t==cur?' selected':'')+'>'+t+'</option>').join('');}
function fillTrims(){fill('#trim',TRIMS[$('#mode').value],false);}
function fillSTrims(){const m=$('#smode').value;fill('#strim',TRIMS[m]||['6x9'],true);}
$('#mode').addEventListener('change',fillTrims);fillTrims();
$('#smode').addEventListener('change',fillSTrims);fillSTrims();
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{
 document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x==b));
 $('#tab-gen').hidden=b.dataset.tab!='gen';$('#tab-studio').hidden=b.dataset.tab!='studio';});
// --- template tab (RB-3 API) ---
$('#f').addEventListener('submit',async ev=>{
 ev.preventDefault();
 const p=new URLSearchParams({trim:$('#trim').value,pages:$('#pages').value,paper:$('#paper').value,mode:$('#mode').value});
 if($('#isbn').value.trim())p.set('isbn',$('#isbn').value.trim());
 const r=await fetch('/api/cover-template?'+p);const svg=await r.text();
 if(!r.ok){$('#canvas').textContent=svg;return;}
 $('#canvas').innerHTML=svg;
 const m=svg.match(/([0-9.]+) x ([0-9.]+) in = (\d+) x (\d+) px/);
 $('#meta').textContent=m?`${m[1]} × ${m[2]} дюймів = ${m[3]} × ${m[4]} px @300DPI`:String(p);
 const dl=$('#dl');dl.hidden=false;dl.href='data:image/svg+xml;utf8,'+encodeURIComponent(svg);
});
// --- studio tab (RB-9) ---
let doc=null,imgData=null;
async function boot(){
 try{
  const drafts=await (await fetch('/api/drafts')).json();
  $('#draftSel').innerHTML='<option value="">— нова —</option>'+drafts.map(d=>`<option value="${d.id}">${d.title}</option>`).join('');
 }catch(e){}
}
$('#draftSel').onchange=async()=>{
 const id=$('#draftSel').value;if(!id)return;
 const d=await (await fetch('/api/drafts/'+id)).json();
 $('#stitle').value=d.meta.title;$('#sauthor').value=d.meta.author;
 try{const c=await (await fetch('/api/drafts/'+id+'/cover'));if(c.ok){doc=await c.json();applyDoc();}}catch(e){}
 render();
};
function collect(){
 doc={mode:$('#smode').value,trim:$('#strim').value,pages:+$('#spages').value,paper:'white',
  bg_front:$('#sbg').value,bg_back:$('#sbg2').value,
  spine_bg:$('#sspine').value,front_image:imgData,
  title:{text:$('#stitle').value||' ',x:0,y:0,pt:36,color:'#ffffff',spine:false},
  author:{text:'by '+($('#sauthor').value||''),x:0,y:0,pt:18,color:'#e6e6e6',spine:false},
  spine_title:null,_auto_spinetxt:$('#sspinetxt').value};
 return doc;
}
function applyDoc(){
 $('#smode').value=doc.mode;fillSTrims();$('#strim').value=doc.trim;$('#spages').value=doc.pages;
 $('#sbg').value=/^#/.test(doc.bg_front)?doc.bg_front:'#1d2733';
 $('#sbg2').value=/^#/.test(doc.bg_back)?doc.bg_back:'#1d2733';
 $('#sspine').value=doc.spine_bg&&/^#/.test(doc.spine_bg)?doc.spine_bg:'#16202c';
 $('#stitle').value=doc.title.text;
 $('#sauthor').value=doc.author.text.replace(/^by\s+/,'');
 imgData=doc.front_image||null;
 moved={};Object.entries(doc.offsets||{}).forEach(([k,v])=>moved[k]=[v[0]*300,v[1]*300]);
 hidden={title:!doc.title.text.trim(),author:!doc.author.text.trim()};
}
$('#simg').onchange=async()=>{
 const f=$('#simg').files[0];if(!f){imgData=null;return;}
 imgData=await new Promise(r=>{const rd=new FileReader();rd.onload=()=>r(rd.result);rd.readAsDataURL(f);});
};
let moved={},hidden={};
function collect(){
 const d={mode:$('#smode').value,trim:$('#strim').value,pages:+$('#spages').value,paper:'white',
  bg_front:$('#sbg').value,bg_back:$('#sbg2').value,
  spine_bg:$('#sspine').value,front_image:imgData,
  title:{text:$('#stitle').value||' ',x:0,y:0,pt:36,color:'#ffffff',spine:false},
  author:{text:'by '+($('#sauthor').value||''),x:0,y:0,pt:18,color:'#e6e6e6',spine:false},
  spine_title:null,
  offsets:Object.fromEntries(Object.entries(moved).map(([k,v])=>[k,[v[0]/300,v[1]/300]]))};
 if(hidden.title)d.title.text=' ';if(hidden.author)d.author.text=' ';
 return d;
}
async function render(){
 const d=collect();doc=d;
 const r=await fetch('/api/cover',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(d)});
 const svg=await r.text();
 if(!r.ok){$('#sstat').textContent=svg.slice(0,120);return;}
 let out=svg;
 if($('#sspinetxt').value==='off')out=out.replace(/<g id="layer-spine"[\s\S]*?<\/g>/,'');
 if(hidden.spine)out=out.replace(/<g id="layer-spine"[\s\S]*?<\/g>/,'');
 $('#preview').innerHTML=out;
 $('#sstat').textContent='';initCanvas();
 return out;
}
/* --- RB-21b interactive canvas v2: select/drag/resize/nudge/zoom/guides --- */
let selId=null, zoom=1, resized={};
const LIDS=['layer-title','layer-author','layer-spine','layer-image','layer-bg-front','layer-bg-spine','layer-bg-back'];
const RESIZABLE=['layer-image','layer-bg-front','layer-bg-spine'];
const SAFE=0.25*300;
function geomFront(svg){const r=svg.querySelector('#layer-bg-front');if(!r)return null;
 return {x:+r.getAttribute('x'),y:+r.getAttribute('y'),w:+r.getAttribute('width'),h:+r.getAttribute('height')};}
function setZoom(z,svg){zoom=Math.min(4,Math.max(.1,z));const el=svg||$('#preview svg');if(!el)return;
 el.style.maxWidth='none';el.style.transform='scale('+zoom+')';el.style.transformOrigin='top left';
 const zp=$('#zoomPct');if(zp)zp.textContent=Math.round(zoom*100)+'%';}
function initCanvas(){
 const svgEl=$('#preview svg');if(!svgEl)return;
 svgEl.style.pointerEvents='auto';
 const fit=()=>{const box=$('#preview').clientWidth-24;const w=svgEl.viewBox.baseVal.width||1;setZoom(Math.min(1,box/w),svgEl);};
 svgEl._fit=fit;fit();
 LIDS.forEach(id=>{const el=svgEl.querySelector('#'+id);if(!el)return;
  const tr=(el.getAttribute('transform')||'').match(/translate\(\s*(-?[\d.]+)[ ,]+(-?[\d.]+)/);
  if(!moved[id])moved[id]=[tr?+tr[1]:0,tr?+tr[2]:0];
  el.style.cursor='move';
   const meta=document.querySelector('#tab-studio p.meta');if(meta&&!meta.dataset.rb30){meta.dataset.rb30='1';meta.textContent='Клік по шару — перетягни (миша/палець); стрілки nudge 1px (Shift 10px); Ctrl+колесо / pinch / Ctrl+± — зум; Del — прибрати текст; Esc — зняти вибір.';}
   el.addEventListener('pointerdown',e=>{if(e.target.classList.contains('hd')||window._pinch)return;e.preventDefault();select(svgEl,el,id);
   const sx=e.clientX,sy=e.clientY,b=moved[id].slice();
   const mv=ev=>{const ctm=svgEl.getScreenCTM();
    let dx=(ev.clientX-sx)/ctm.a,dy=(ev.clientY-sy)/ctm.d;
    const sn=snapGuides(svgEl,el,b[0]+dx,b[1]+dy);dx=sn.dx;dy=sn.dy;
    moved[id]=[b[0]+dx,b[1]+dy];applyT(svgEl,id);drawBox(svgEl,el);safeBadge(svgEl,el);};
   const up=()=>{document.removeEventListener('pointermove',mv);document.removeEventListener('pointerup',up);clearGuides(svgEl);};
   document.addEventListener('pointermove',mv);document.addEventListener('pointerup',up);});
 });
 drawLayBox(svgEl);
}
function snapGuides(svgEl,el,tx,ty){
 let bb=null;try{bb=el.getBBox();}catch(e){}
 if(!bb)return{dx:tx,dy:ty};
 const front=geomFront(svgEl);let dx=tx,dy=ty;const tol=6/ (zoom||1);
 clearGuides(svgEl);
 const cxPrev=bb.x+bb.width/2, cyPrev=bb.y+bb.height/2;
 const want=[front?front.x+front.w/2:null];
 const yWant=front?[front.y+SAFE, front.y+front.h-SAFE, front.y+front.h/2]:[];
 if(front){const ncx=cxPrev+dx;
  for(const gx of want){if(gx!==null&&Math.abs(ncx-gx)<tol){dx+=gx-ncx;guide(svgEl,'v',gx);}}}
 const ncy=cyPrev+dy;
 for(const gy of yWant){if(Math.abs(ncy-gy)<tol){dy+=gy-ncy;guide(svgEl,'h',gy);}}
 return{dx,dy};
}
function guide(svgEl,dir,pos){const ns='http://www.w3.org/2000/svg';const ln=document.createElementNS(ns,'line');
 const vb=svgEl.viewBox.baseVal;
 ln.setAttribute('x1',dir==='v'?pos:0);ln.setAttribute('x2',dir==='v'?pos:vb.width);
 ln.setAttribute('y1',dir==='h'?pos:0);ln.setAttribute('y2',dir==='h'?pos:vb.height);
 ln.setAttribute('stroke','#e0409a');ln.setAttribute('stroke-width',2/(zoom||1));ln.setAttribute('class','gl');
 svgEl.appendChild(ln);}
function clearGuides(svgEl){svgEl.querySelectorAll('.gl').forEach(e=>e.remove());}
function applyT(svgEl,id){const el=svgEl.querySelector('#'+id);if(!el)return;const m=moved[id]||[0,0];
 if(!el.hasAttribute('data-base-t'))el.setAttribute('data-base-t',(el.getAttribute('transform')||''));
 const base=el.getAttribute('data-base-t');
 el.setAttribute('transform',(base+' translate('+m[0]+' '+m[1]+')').trim());}
function select(svgEl,el,id){selId=id;drawBox(svgEl,el);}
function drawBox(svgEl,el){if(!svgEl)return;svgEl.querySelectorAll('.selbox,.hd').forEach(e=>e.remove());
 let bb;try{bb=el.getBBox();}catch(e){return;}
 const ns='http://www.w3.org/2000/svg';const x=bb.x,y=bb.y,w=bb.width,h=bb.height;
 const r=document.createElementNS(ns,'rect');r.setAttribute('class','selbox');
 r.setAttribute('x',x-5);r.setAttribute('y',y-5);r.setAttribute('width',w+10);r.setAttribute('height',h+10);
 r.setAttribute('fill','none');r.setAttribute('stroke','#7aa2f7');r.setAttribute('stroke-width',3/zoom);r.setAttribute('stroke-dasharray','8,6');r.setAttribute('pointer-events','none');
 svgEl.appendChild(r);
 if(RESIZABLE.includes(el.id)){
  const pts=[[x,y,-1,-1],[x+w/2,y,0,-1],[x+w,y,1,-1],[x+w,y+h/2,1,0],[x+w,y+h,1,1],[x+w/2,y+h,0,1],[x,y+h,-1,1],[x,y+h,-1,0]];
  for(const [px,py,sx,sy] of pts){const hd=document.createElementNS(ns,'rect');hd.setAttribute('class','hd');
   const s=10/zoom;hd.setAttribute('x',px-s/2);hd.setAttribute('y',py-s/2);hd.setAttribute('width',s);hd.setAttribute('height',s);
   hd.setAttribute('fill','#fff');hd.setAttribute('stroke','#7aa2f7');hd.setAttribute('stroke-width',2/zoom);
   hd.style.cursor=(sx&&sy)?(sx*sy>0?'nwse-resize':'nesw-resize'):(sx?'ew-resize':'ns-resize');
   hd.dataset.sx=sx;hd.dataset.sy=sy;
   hd.addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();
    const el2=svgEl.querySelector('#'+el.id);const g={x:+el2.getAttribute('x'),y:+el2.getAttribute('y'),w:+el2.getAttribute('width'),h:+el2.getAttribute('height')};
    const ctm=svgEl.getScreenCTM();const ox=e.clientX,oy=e.clientY;
    const mv=ev=>{let dx=(ev.clientX-ox)/ctm.a*zoom,dy=(ev.clientY-oy)/ctm.d*zoom;
     const nx=sx?g.x+dx:g.x, nw=sx?Math.max(20,g.w+dx*(sx>0?1:-1)):g.w;
     const ny=sy?g.y+dy:g.y, nh=sy?Math.max(20,g.h+dy*(sy>0?1:-1)):g.h;
     el2.setAttribute('x',Math.min(nx,nx+(sx<0?g.w+dx-nw:0)));el2.setAttribute('width',nw);
     el2.setAttribute('y',Math.min(ny,ny+(sy<0?g.h+dy-nh:0)));el2.setAttribute('height',nh);
     drawBox(svgEl,el2);safeBadge(svgEl,el2);};
    const up=()=>{document.removeEventListener('pointermove',mv);document.removeEventListener('pointerup',up);
     resized[el.id]={x:+el2.getAttribute('x'),y:+el2.getAttribute('y'),w:+el2.getAttribute('width'),h:+el2.getAttribute('height')};};
    document.addEventListener('pointermove',mv);document.addEventListener('pointerup',up);});
   svgEl.appendChild(hd);}
 }
}
function safeBadge(svgEl,el){const bad=$('#safeBadge');let bb;try{bb=el.getBBox();}catch(e){bad.textContent='';return;}
 const front=geomFront(svgEl);if(!front){bad.textContent='';return;}
 const out=bb.x<front.x+SAFE||bb.y<front.y+SAFE||bb.x+bb.width>front.x+front.w-SAFE||bb.y+bb.height>front.y+front.h-SAFE;
 bad.textContent=out?'⚠ поза safe-зоною (0.25″)':'✓ у safe-зоні';bad.style.color=out?'#f85149':'#3fb950';}
function drawLayBox(svgEl){
 const box=$('#layBox');box.innerHTML='';
 [['title','назва'],['author','автор'],['spine','корінець']].forEach(([k,name])=>{
  const el=svgEl&&svgEl.querySelector('#layer-'+k);if(!el)return;
  const lb=document.createElement('label');
  lb.innerHTML='<input type="checkbox" '+(hidden[k]?'':'checked')+'/> '+name;
  lb.querySelector('input').onchange=e=>{hidden[k]=!e.target.checked;el.style.opacity=e.target.checked?1:0;};
  box.appendChild(lb);});
 const zl=document.createElement('span');zl.innerHTML='<a href="#" id="zFit">fit</a> · <a href="#" id="z100">100%</a> · <b id="zoomPct">100%</b>';
 box.appendChild(zl);
 setTimeout(()=>{$('#zFit').onclick=e=>{e.preventDefault();const s=$('#preview svg');s&&s._fit&&s._fit();};
   $('#z100').onclick=e=>{e.preventDefault();setZoom(1);};},0);
}
/* RB-30: touchpad (ctrl+wheel = trackpad pinch) + two-finger pinch + Ctrl+± on the 2D canvas */
(function(){let init=false;
 function bind(){const pv=$('#preview');if(!pv||init)return;init=true;
  const pts=new Map();let dist=0,z0=1;
  pv.addEventListener('pointerdown',e=>{if(e.pointerType!=='touch')return;pts.set(e.pointerId,[e.clientX,e.clientY]);
   if(pts.size===2){window._pinch=true;const p=[...pts.values()];dist=Math.hypot(p[0][0]-p[1][0],p[0][1]-p[1][1]);z0=zoom;}});
  pv.addEventListener('pointermove',e=>{if(!pts.has(e.pointerId))return;pts.set(e.pointerId,[e.clientX,e.clientY]);
   if(pts.size>=2&&window._pinch){const p=[...pts.values()];const d=Math.hypot(p[0][0]-p[1][0],p[0][1]-p[1][1]);
    if(dist&&d)setZoom(z0*d/dist,$('#preview svg'));}});
  const up=e=>{pts.delete(e.pointerId);if(pts.size<2){window._pinch=false;dist=0;}};
  pv.addEventListener('pointerup',up);pv.addEventListener('pointercancel',up);
  pv.addEventListener('wheel',e=>{if(!e.ctrlKey)return;e.preventDefault();setZoom(zoom*(e.deltaY<0?1.08:.93),$('#preview svg'));},{passive:false});}}
 new MutationObserver(bind).observe(document.getElementById('preview'),{childList:true});bind();})();
document.addEventListener('keydown',e=>{
 if(e.target===$('#stage3d'))return;
 if(['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName))return;
 const svgEl=$('#preview svg');if(!svgEl)return;
 if(e.key==='Escape'){svgEl.querySelectorAll('.selbox,.hd,.gl').forEach(x=>x.remove());selId=null;return;}
  if((e.ctrlKey||e.metaKey)&&e.key==='0'){e.preventDefault();if(e.shiftKey)setZoom(1);else{svgEl._fit&&svgEl._fit();}return;}
  if((e.ctrlKey||e.metaKey)&&(e.key==='='||e.key==='+')){e.preventDefault();setZoom(zoom*1.2);return;}
  if((e.ctrlKey||e.metaKey)&&e.key==='-'){e.preventDefault();setZoom(zoom/1.2);return;}
 if(!selId)return;const el=svgEl.querySelector('#'+selId);if(!el)return;
 if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(e.key)){const d=e.shiftKey?10:1;
  const m=e.key==='ArrowLeft'?[-d,0]:e.key==='ArrowRight'?[d,0]:e.key==='ArrowUp'?[0,-d]:[0,d];
  moved[selId]=[moved[selId][0]+m[0],moved[selId][1]+m[1]];applyT(svgEl,selId);drawBox(svgEl,el);safeBadge(svgEl,el);e.preventDefault();}
 if(e.key==='Delete'){hidden[selId.replace('layer-','')]=true;el.style.opacity=0;drawLayBox(svgEl);selId=null;drawBox(svgEl,el);}});
$('#renderBtn').onclick=render;
$('#sf').addEventListener('input',()=>render());
$('#saveBtn').onclick=async()=>{
 const id=$('#draftSel').value;
 if(!id){$('#sstat').textContent='оберіть чернетку';return;}
 await render();
 const r=await fetch('/api/drafts/'+id+'/cover',{method:'PUT',headers:{'content-type':'application/json'},body:JSON.stringify(doc)});
 $('#sstat').textContent=r.ok?'cover.json збережено у '+id:await r.text();
};
$('#applyBtn').onclick=async()=>{await render();$('#sstat').textContent='переміщення застосовано';};
/* --- RB-27 3D mockup (CSS transforms, no libs) --- */
let d3=null,rx=-14,ry=-28,s3=42;
function f3d(ww,hh,dd,bg,html,tf){return '<div style="position:absolute;display:flex;align-items:center;justify-content:center;text-align:center;overflow:hidden;background:'+bg+';transform:translate(-50%,-50%) '+tf+';left:50%;top:50%;width:'+ww+'px;height:'+hh+'px;color:#fff;font-family:Georgia,serif;box-shadow:inset 0 0 30px rgba(0,0,0,.35)">'+(html||'')+'</div>';}
async function build3d(){
 const mode=$('#smode').value;
 const p=new URLSearchParams({mode:mode==='ebook'?'pb':mode==='dj'?'hc':mode,trim:$('#strim').value,pages:$('#spages').value,paper:'white'});
 try{d3=await (await fetch('/api/cover/dims?'+p)).json();}catch(e){$('#v3Dims').textContent='dims: '+e;return;}
 if(mode==='dj'){try{const wp=await (await fetch('/api/cover/dims?'+new URLSearchParams({mode:'dj',trim:$('#strim').value,pages:$('#spages').value,paper:'white'})));if(wp.ok){d3.wrap_w_in=wp.wrap_w_in;d3.dj=true;}}catch(e){}}
 $('#v3Dims').textContent=(mode==='dj'?'dj on case · ':mode==='hc'?'hc case · ':'')+'trim '+d3.trim+' · spine '+d3.spine_in.toFixed(4)+'in · '+d3.pages+'p'+(d3.wrap_w_in?' · wrap '+d3.wrap_w_in.toFixed(2)+'in':'');
 stage3d();
}
function stage3d(){const b=$('#book3d');
 const w=(d3.trim_w_in*s3),h=(d3.trim_h_in*s3),d=Math.max(6,d3.spine_in*s3);
 b.style.width=w+'px';b.style.height=h+'px';b.style.marginLeft=(-w/2)+'px';b.style.marginTop=(-h/2)+'px';
 const tt=($('#stitle')||{}).value||d3.trim,au=($('#sauthor')||{}).value||'';
 const bgF=/^#[0-9a-f]{3,8}$/i.test($('#sbg').value)?$('#sbg').value:'#1d2733';
 const bgB=$('#sbg2').value,bgS=$('#sspine').value;
 const sp=Math.max(8,d3.spine_in*s3);
 b.innerHTML=f3d(w,h,d,bgF,'<div style="padding:1em;max-width:90%"><div style="font-size:'+Math.max(10,Math.min(34,s3*.8))+'px;line-height:1.2">'+esc3(tt)+'</div><div style="opacity:.8;margin-top:.6em;font-size:'+Math.max(9,s3*.4)+'px">'+esc3(au)+'</div></div>','rotateY(0deg) translateZ('+(d/2)+'px)')
 +f3d(w,h,d,bgB,'<div style="opacity:.55;font-size:'+Math.max(9,s3*.4)+'px">'+esc3(au)+'</div>','rotateY(180deg) translateZ('+(d/2)+'px)')
 +f3d(d,h,0,bgS,'<div style="writing-mode:vertical-rl;transform:rotate(180deg);font-size:'+Math.min(sp*.62,Math.max(8,s3*.45))+'px;white-space:nowrap;overflow:hidden">'+esc3(tt)+' — '+esc3(au)+'</div>','rotateY(-90deg) translateZ('+(w/2)+'px)')
 +f3d(w,d,0,'linear-gradient(#eee,#bbb)','', 'rotateX(90deg) translateZ('+(h/2)+'px)')
 +f3d(w,d,0,'linear-gradient(#bbb,#eee)','', 'rotateX(-90deg) translateZ('+(h/2)+'px)')
  +f3d(d,h,0,'repeating-linear-gradient(90deg,#f4f1e8 0 2px,#c9c4b4 2px 4px)','','rotateY(90deg) translateZ('+(w/2)+'px)');
  if(d3.dj&&d3.wrap_w_in){
   const ov=0.125*s3,wJ=w+2*ov,hJ=h+2*ov,dJ=d+2*ov;
   const flapIn=Math.max(0.4,(d3.wrap_w_in-(2*d3.trim_w_in+d3.spine_in+0.5))/2),flapW=flapIn*s3;
   const cloth='linear-gradient(135deg,#26364a,#16202c)',paper='#efe9db';
   const hingeL='<div style="position:absolute;left:0;top:0;bottom:0;width:14%;background:linear-gradient(90deg,#00000066,transparent)"></div>';
   const hingeR='<div style="position:absolute;right:0;top:0;bottom:0;width:14%;background:linear-gradient(270deg,#00000066,transparent)"></div>';
   const jt='<div style="padding:1em;max-width:90%"><div style="font-size:'+Math.max(10,Math.min(30,s3*.7))+'px">'+esc3(tt)+'</div></div>';
   b.innerHTML+=f3d(wJ,hJ,dJ,cloth,jt+hingeL,'rotateY(0deg) translateZ('+(dJ/2)+'px)')
    +f3d(wJ,hJ,dJ,bgB,hingeR,'rotateY(180deg) translateZ('+(dJ/2)+'px)')
    +f3d(dJ,hJ,0,bgS,'<div style="writing-mode:vertical-rl;transform:rotate(180deg);font-size:'+Math.max(8,s3*.4)+'px;white-space:nowrap;overflow:hidden">'+esc3(tt)+' — '+esc3(au)+'</div>','rotateY(-90deg) translateZ('+(wJ/2)+'px)')
    +f3d(flapW,hJ-2,0,paper,'','translate3d('+(wJ/2-flapW/2)+'px,0,'+(dJ/2-2)+'px) rotateY(180deg)')
    +f3d(flapW,hJ-2,0,paper,'','translate3d('+(wJ/2-flapW/2)+'px,0,'+(-dJ/2+2)+'px)');
  }
  pose();}
function esc3(s){return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function pose(){const b=$('#book3d');b.style.transform='rotateX('+rx+'deg) rotateY('+ry+'deg)';}
$('#v3Btn').onclick=async()=>{const st=$('#stage3d');st.hidden=!st.hidden;$('#v3Reset').hidden=st.hidden;
 if(!st.hidden)await build3d();};
$('#v3Reset').onclick=()=>{rx=-14;ry=-28;s3=42;build3d();};
/* RB-30: mini-3D — mouse + touchpad (ctrl+wheel/pinch) + keyboard (arrows/PgUp/PgDn/0) */
(function(){const st=$('#stage3d');st.tabIndex=0;
 const pts=new Map();let drag=null,lastDist=0;
 st.addEventListener('pointerdown',e=>{if(!d3||window._pinch)return;st.focus();pts.set(e.pointerId,[e.clientX,e.clientY]);
  if(pts.size===1){drag=[e.clientX,e.clientY,ry,rx];st.setPointerCapture(e.pointerId);}
  else if(pts.size===2){drag=null;const p=[...pts.values()];lastDist=Math.hypot(p[0][0]-p[1][0],p[0][1]-p[1][1]);}});
 st.addEventListener('pointermove',e=>{if(!pts.has(e.pointerId))return;pts.set(e.pointerId,[e.clientX,e.clientY]);
  if(pts.size>=2){const p=[...pts.values()];const d=Math.hypot(p[0][0]-p[1][0],p[0][1]-p[1][1]);
   if(lastDist&&d){s3=Math.max(18,Math.min(90,s3*d/lastDist));stage3d();}lastDist=d;return;}
  if(!drag||!d3)return;ry=drag[2]+(e.clientX-drag[0])*.4;rx=Math.max(-80,Math.min(80,drag[3]-(e.clientY-drag[1])*.3));pose();});
 const up=e=>{pts.delete(e.pointerId);if(pts.size<2)lastDist=0;if(!pts.size)drag=null;};
 st.addEventListener('pointerup',up);st.addEventListener('pointercancel',up);
 st.addEventListener('wheel',e=>{if(!d3)return;e.preventDefault();s3=Math.max(18,Math.min(90,s3*(e.deltaY<0?1.08:0.93)));stage3d();},{passive:false});
 st.addEventListener('keydown',e=>{if(!d3)return;const k=e.key;
  if(k==='ArrowLeft'){ry-=6;pose();}else if(k==='ArrowRight'){ry+=6;pose();}
  else if(k==='ArrowUp'){rx=Math.max(-80,rx-5);pose();}else if(k==='ArrowDown'){rx=Math.min(80,rx+5);pose();}
  else if(k==='PageUp'||k==='+'||k==='='){s3=Math.min(90,s3*1.1);stage3d();}
  else if(k==='PageDown'||k==='-'||k==='_'){s3=Math.max(18,s3/1.1);stage3d();}
  else if(k==='0'||k==='Home'){rx=-14;ry=-28;s3=42;stage3d();}
  else return;e.preventDefault();});
 })();
$('#svgBtn').onclick=async()=>{const svg=await render();if(!svg)return;
 const a=document.createElement('a');a.href='data:image/svg+xml;utf8,'+encodeURIComponent(svg);a.download=(doc?doc.mode:'cover')+'-cover.svg';a.click();};
 $('#pngBtn').onclick=async()=>{const svg=await render();if(!svg)return;
  const sc=Math.max(1,Math.min(3,+(($('#pngScale')||{}).value)||1));
  const up=sc>1?svg.replace(/<svg[^>]*>/,t=>t.replace(/(width|height)="([0-9.]+)"/g,(x,p,v)=>p+'="'+(Math.round(+v*sc))+'"')):svg;
  const img=new Image();img.onload=()=>{const c=document.createElement('canvas');
   c.width=img.naturalWidth||+up.match(/<svg[^>]*width="(\d+)"/)[1];c.height=img.naturalHeight||+up.match(/<svg[^>]*height="(\d+)"/)[1];
   c.getContext('2d').drawImage(img,0,0);
   const a=document.createElement('a');a.href=c.toDataURL('image/png');a.download=(sc>1?'cover-'+sc+'x-':'cover-')+(doc?(doc.trim||doc.mode):'')+'-300dpi.png';a.click();};
  img.src='data:image/svg+xml;base64,'+btoa(unescape(encodeURIComponent(up)));};
boot();
</script>
