<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>3D preflight — rebook</title>
<link rel="stylesheet" href="/styles.css"/>
<style>
 .rb-nav{position:sticky;top:0;z-index:7;display:flex;gap:.9em;align-items:center;padding:.5em .9em;background:#161922;border-bottom:1px solid #2f3542;font:600 14px/1.4 system-ui,'Segoe UI',sans-serif;color:#9aa0ac}
 .rb-nav .rb-brand{color:#7aa2f7;font-weight:800;letter-spacing:.04em}
 .rb-nav a{color:#9aa0ac;text-decoration:none;padding:.2em .1em;border-bottom:2px solid transparent}
 .rb-nav a:hover{color:#e6e6e6}
 .rb-nav a.active{color:#7aa2f7;border-bottom-color:#7aa2f7}
 .rb-nav .rb-home{margin-left:auto;font-weight:400;font-size:.85em}
 body{margin:0;background:#0c0f16;color:#e6e6e6;font:14px/1.5 system-ui,'Segoe UI',sans-serif}
 .wrap{padding:1em 1.4em;display:grid;grid-template-columns:1fr 300px;gap:1em}
 .bar{display:flex;gap:.8em;align-items:end;flex-wrap:wrap;background:#161922;border:1px solid #2f3542;border-radius:12px;padding:.8em 1em;margin-bottom:.8em}
 label{display:flex;flex-direction:column;font-size:.8em;color:#9aa0ac;gap:.25em}
 select,input[type=number]{background:#12141a;color:#e6e6e6;border:1px solid #2f3542;border-radius:8px;padding:.4em .55em;font:inherit}
 .btn{background:#7aa2f7;color:#0b1020;border:0;border-radius:8px;padding:.5em 1em;font-weight:700;cursor:pointer}
 .btn.ghost{background:transparent;color:#7aa2f7;border:1px solid #7aa2f7}
 #readout{color:#9aa0ac;font-size:.85em;align-self:center}
  #stage{perspective:1700px;height:64vh;min-height:430px;background:radial-gradient(1200px 520px at 50% 18%,#171b26,#0b0e14);border:1px solid #2f3542;border-radius:14px;overflow:hidden;position:relative;cursor:grab;touch-action:none}
  #stage.dragging{cursor:grabbing}
  #stage:focus-visible{outline:2px solid #7aa2f7;outline-offset:-2px}
 #book3d{position:absolute;left:50%;top:50%;transform-style:preserve-3d}
 #hint{position:absolute;bottom:.6em;width:100%;text-align:center;color:#5f6775;margin:0;font-size:.85em}
 #warns{background:#161922;border:1px solid #2f3542;border-radius:12px;padding:.8em 1em;height:fit-content;max-height:78vh;overflow:auto}
 #warns h3{margin:.1em 0 .6em;font-size:.95em;color:#e6e6e6}
 #warns .w{display:flex;gap:.5em;padding:.35em 0;border-top:1px solid #212635;font-size:.85em;line-height:1.4}
 #warns .ok{color:#3fb950} #warns .bad{color:#f85149}
 .ovl{position:absolute;inset:0;pointer-events:none}
 .faceImg{position:absolute;inset:0;width:100%;height:100%;object-fit:fill}
</style>
</head>
<body>
<!--rbnav-->
<div class="wrap">
 <div>
  <div class="bar">
   <label><span data-uk="📚 Книга (EPUB із полиці)" data-en="📚 Book (shelf EPUB)">📚 Книга (EPUB із полиці)</span><select id="bookSel" style="min-width:15em"><option>—</option></select></label>
    <label><span data-uk="Формат" data-en="Format">Формат</span><select id="fmt"><option value="hc" data-uk="Hardcover (case)" data-en="Hardcover (case)">Hardcover (case)</option><option value="dj" data-uk="Dust jacket (Ingram)" data-en="Dust jacket (Ingram)">Dust jacket (Ingram)</option><option value="pb" data-uk="Paperback" data-en="Paperback">Paperback</option><option value="ebook" data-uk="eBook front" data-en="eBook front">eBook front</option></select></label>
   <label><span data-uk="Trim" data-en="Trim">Trim</span><select id="trim"></select></label>
   <label><span data-uk="Сторінки" data-en="Pages">Сторінки</span><input id="pages" type="number" value="300" min="24" max="828" step="2" style="width:7em"/></label>
   <label style="gap:0"><input id="guides" type="checkbox" checked style="width:auto"/> <span data-uk="накладки KDP" data-en="KDP overlays">накладки KDP</span></label>
   <button class="btn" id="go" data-uk="🖼 Показати на стенді" data-en="🖼 Show on stand">🖼 Показати на стенді</button>
   <button class="btn ghost" id="reset" data-uk="скинути кут" data-en="reset angle">скинути кут</button>
   <span id="readout"></span>
  </div>
  <div id="stage"><div id="book3d"></div><p id="hint">тягни / палець — обертати · колесо / pinch — зум · Tab на сцену: ←→↑↓ кут, PgUp/PgDn зум, 0 — скинути · галочка «накладки» вмикає bleed/safe/fold-гади</p></div>
 </div>
 <aside id="warns"><h3 data-uk="⚠ Preflight" data-en="⚠ Preflight">⚠ Preflight</h3><div class="w"><span class="muted" data-uk="обери книгу — звіт KDP-перевірок з'явиться тут" data-en="pick a book — the KDP report appears here">обери книгу — звіт KDP-перевірок з'явиться тут</span></div></aside>
</div>
<script>
const $=s=>document.querySelector(s);
const TRIMS={pb:["5x8","5.06x7.81","5.25x8","5.5x8.5","6x9","6.14x9.21","6.69x9.61","7x10","7.5x9.25","8x10","8.25x8.25","8.5x11"],
 hc:["5.5x8.5","6x9","6.14x9.21","7x10","8.25x11"],dj:["5x8","5.5x8.5","6x9","7x10"]};
let pf=null,rx=-14,ry=-28,s3=40,books=[],djD=null;
function esc(s){return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
async function boot(){
 try{books=await (await fetch('/api/books')).json();}catch(e){books=[];}
 const pre=new URLSearchParams(location.search).get('book');
 $('#bookSel').innerHTML=books.length?books.map(b=>`<option value="${b.id}">${esc(b.title)} · ${b.language} · ${b.chapters} р.</option>`).join(''):'<option value="">— немає книг на полиці —</option>';
 if(books.length){const b=books.find(x=>x.id===pre)||books[0];$('#bookSel').value=b.id;}
 fillTrims();go();
}
function fillTrims(){const v=$('#fmt').value;const m=v==='hc'||v==='dj'?v:'pb';const cur=$('#trim').value;
 $('#trim').innerHTML=TRIMS[m].map(t=>'<option'+(t===cur?' selected':(t==='6x9'&&TRIMS[m].includes('6x9')?' selected':''))+'>'+t+'</option>').join('');}
$('#fmt').onchange=()=>{fillTrims();go();};
$('#bookSel').onchange=go;$('#trim').onchange=go;$('#pages').onchange=go;$('#guides').onchange=()=>stage();
$('#go').onclick=go;
$('#reset').onclick=()=>{rx=-14;ry=-28;stage();};
async function go(){
 const id=$('#bookSel').value;let mode=$('#fmt').value;
 if(!id){$('#readout').textContent='немає книг';return;}
 djD=null;
 const geomMode=mode==='dj'?'hc':mode;
 const p=new URLSearchParams({mode:geomMode,trim:$('#trim').value,pages:$('#pages').value||300,paper:'white'});
 try{const r=await fetch(`/api/books/${id}/preflight?`+p);pf=await r.json();if(!r.ok)throw new Error(pf.detail||r.status);}catch(e){$('#readout').textContent='preflight err';return;}
 if(mode==='dj'){try{const r2=await fetch(`/api/cover/dims?`+new URLSearchParams({mode:'dj',trim:$('#trim').value,pages:$('#pages').value||300,paper:'white'}));djD=await r2.json();if(!r2.ok)djD=null;}catch(e){djD=null;}}
 const nOK=(pf.warnings||[]).filter(w=>!w.ok).length;
 $('#readout').textContent=(mode==='hc'?'hardcover · ':mode==='dj'?'dust jacket · ':mode==='pb'?'paperback · ':'ebook · ')+(djD?`wrap ${djD.wrap_w_in.toFixed(2)}×${djD.wrap_h_in.toFixed(2)}″ · `:'')+'spine '+pf.spine_in.toFixed(4)+'″ · '+(nOK?nOK+' ⚠ увага':'усе ✓');
 renderWarns();s3=Math.min(60,Math.floor(300/pf.trim_h_in));stage();
}
function renderWarns(){const w=$('#warns');
 w.innerHTML='<h3>⚠ Preflight ('+(pf.warnings.filter(x=>!x.ok).length)+')</h3>'+
 pf.warnings.map(x=>`<div class="w"><span class="${x.ok?'ok':'bad'}">${x.ok?'✓':'✗'}</span><span>${esc(x.detail)}</span></div>`).join('');}
function guidesSVG(wpx,hpx,trimW,trimH){
 const s=300; // px per inch at scale s3 handled by caller: pass inches→px already scaled
 const bpx=(0.125*s),spx=(0.25*s);
 return `<svg class="ovl" viewBox="0 0 ${wpx} ${hpx}" preserveAspectRatio="none">
  <rect x="${bpx}" y="${bpx}" width="${wpx-2*bpx}" height="${hpx-2*bpx}" fill="none" stroke="#e0a03080" stroke-width="2" stroke-dasharray="10,8"/>
  <rect x="${spx}" y="${spx}" width="${wpx-2*spx}" height="${hpx-2*spx}" fill="none" stroke="#3fb95090" stroke-width="2" stroke-dasharray="14,8"/>
  <line x1="${wpx/2}" y1="0" x2="${wpx/2}" y2="${hpx}" stroke="#7aa2f750" stroke-width="1.5" stroke-dasharray="6,8"/>
  <text x="${spx+6}" y="${hpx-spx-8}" fill="#3fb95090" font-size="14" font-family="system-ui">safe 0.25″</text>
  <text x="${bpx+6}" y="20" fill="#e0a03090" font-size="14" font-family="system-ui">bleed 0.125″</text></svg>`;}
function face(w,h,bg,inner,tf){return '<div style="position:absolute;left:50%;top:50%;width:'+w+'px;height:'+h+'px;transform:translate(-50%,-50%) '+tf+';background:'+bg+';overflow:hidden;color:#fff;font-family:Georgia,serif;box-shadow:inset 0 0 34px rgba(0,0,0,.35)">'+(inner||'')+'</div>';}
function coverInner(w,h){
 if(pf.cover&&pf.cover.data_uri) return '<img class="faceImg" src="'+pf.cover.data_uri+'" alt="cover"/>';
 return '<div style="display:flex;align-items:center;justify-content:center;width:100%;height:100%;text-align:center;padding:1em"><div><div style="font-size:'+Math.max(12,Math.min(38,s3*1.0))+'px;font-weight:700">'+esc(pf.title)+'</div><div style="margin-top:.6em;opacity:.85;font-size:'+Math.max(10,s3*.5)+'px">'+esc(pf.author)+'</div></div></div>';}
function stage(){
 const b=$('#book3d');if(!pf){b.innerHTML='';return;}
 const g=$('#guides').checked;
 const w=pf.trim_w_in*s3,h=pf.trim_h_in*s3,d=Math.max(6,pf.spine_in*s3);
 b.style.width=w+'px';b.style.height=h+'px';b.style.marginLeft=(-w/2)+'px';b.style.marginTop=(-h/2)+'px';
 const ov=g?guidesSVG(w,h,pf.trim_w_in,pf.trim_h_in):'';
 const front=face(w,h,'#1d2733',coverInner(w,h)+ov,'rotateY(0deg) translateZ('+(d/2)+'px)');
 if($('#fmt').value==='ebook'){$('#book3d').innerHTML=front;pose();return;}
 const backTxt='<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;opacity:.9"><div style="font-size:'+Math.max(10,s3*.5)+'px">'+esc(pf.author)+'</div><div style="margin-top:auto;margin-bottom:1em;font-size:10px;opacity:.5">автозаливка · перевір safe-зону</div></div>';
 const back=face(w,h,pf.back_color,backTxt+ov,'rotateY(180deg) translateZ('+(d/2)+'px)');
 const spineTxt='<div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center"><div style="writing-mode:vertical-rl;transform:rotate(180deg);font-size:'+Math.min(d*.6,Math.max(9,s3*.5))+'px;white-space:nowrap;overflow:hidden;max-height:90%">'+esc(pf.title)+' — '+esc(pf.author)+'</div></div>'+(g?'<svg class="ovl" viewBox="0 0 '+d+' '+h+'" preserveAspectRatio="none"><line x1="2" y1="0" x2="2" y2="'+h+'" stroke="#e0409a90" stroke-width="2" stroke-dasharray="8,6"/><line x1="'+(d-2)+'" y1="0" x2="'+(d-2)+'" y2="'+h+'" stroke="#e0409a90" stroke-width="2" stroke-dasharray="8,6"/></svg>':'');
 const spine=face(d,h,pf.spine_color,spineTxt,'rotateY(-90deg) translateZ('+(w/2)+'px)');
 const head=face(w,d,'#d8d4c8','','rotateX(90deg) translateZ('+(h/2)+'px)');
 const tail=face(w,d,'#b9b5a8','','rotateX(-90deg) translateZ('+(h/2)+'px)');
  const edge=face(d,h,'repeating-linear-gradient(90deg,#f4f1e8 0 2px,#c9c4b4 2px 4px)','','rotateY(90deg) translateZ('+(w/2)+'px)');
  let dj='';
  if($('#fmt').value==='dj'&&djD){
   const ov=0.125*s3,wJ=w+2*ov,hJ=h+2*ov,dJ=d+2*ov;
   const flapIn=Math.max(0.4,(djD.wrap_w_in-(2*pf.trim_w_in+djD.spine_in+0.5))/2),flapW=flapIn*s3;
   const cloth='linear-gradient(135deg,#26364a,#16202c)',paper='#efe9db';
   const art=(pf.cover&&pf.cover.data_uri)?'<img class="faceImg" src="'+pf.cover.data_uri+'" alt=""/>':'';
   const hingeL='<div style="position:absolute;left:0;top:0;bottom:0;width:14%;background:linear-gradient(90deg,#00000066,transparent)"></div>';
   const hingeR='<div style="position:absolute;right:0;top:0;bottom:0;width:14%;background:linear-gradient(270deg,#00000066,transparent)"></div>';
   const jSp='<div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center"><div style="writing-mode:vertical-rl;transform:rotate(180deg);font-size:'+Math.min(dJ*.55,Math.max(9,s3*.45))+'px;white-space:nowrap;overflow:hidden;max-height:92%;color:#fff">'+esc(pf.title)+' — '+esc(pf.author)+'</div></div>';
   dj=face(wJ,hJ,cloth,art+hingeL,'rotateY(0deg) translateZ('+(dJ/2)+'px)')
    +face(wJ,hJ,pf.back_color||cloth,hingeR,'rotateY(180deg) translateZ('+(dJ/2)+'px)')
    +face(dJ,hJ,pf.spine_color||cloth,jSp,'rotateY(-90deg) translateZ('+(wJ/2)+'px)')
    +face(flapW,hJ-2,paper,'','translate3d('+(wJ/2-flapW/2)+'px,0,'+(dJ/2-2)+'px) rotateY(180deg)')
    +face(flapW,hJ-2,paper,'','translate3d('+(wJ/2-flapW/2)+'px,0,'+(-dJ/2+2)+'px)');
  }
  b.innerHTML=front+back+spine+head+tail+edge+dj;pose();}
function pose(){$('#book3d').style.transform='rotateX('+rx+'deg) rotateY('+ry+'deg)';}
/* RB-30: mouse + touchpad (ctrl+wheel/pinch) + keyboard (arrows/PgUp/PgDn/0) */
(function(){const st=$('#stage');st.tabIndex=0;
 const pts=new Map();let drag=null,lastDist=0;
 st.addEventListener('pointerdown',e=>{st.focus();pts.set(e.pointerId,[e.clientX,e.clientY]);
  if(pts.size===1){drag=[e.clientX,e.clientY,ry,rx];st.classList.add('dragging');st.setPointerCapture(e.pointerId);}
  else if(pts.size===2){drag=null;st.classList.remove('dragging');const p=[...pts.values()];lastDist=Math.hypot(p[0][0]-p[1][0],p[0][1]-p[1][1]);}});
 st.addEventListener('pointermove',e=>{if(!pts.has(e.pointerId))return;pts.set(e.pointerId,[e.clientX,e.clientY]);
  if(pts.size>=2){const p=[...pts.values()];const d=Math.hypot(p[0][0]-p[1][0],p[0][1]-p[1][1]);
   if(lastDist&&d){s3=Math.max(14,Math.min(120,s3*d/lastDist));stage();}lastDist=d;return;}
  if(!drag)return;ry=drag[2]+(e.clientX-drag[0])*.45;rx=Math.max(-85,Math.min(85,drag[3]-(e.clientY-drag[1])*.35));pose();});
 const up=e=>{pts.delete(e.pointerId);if(pts.size<2)lastDist=0;if(!pts.size){drag=null;st.classList.remove('dragging');}};
 addEventListener('pointerup',up);addEventListener('pointercancel',up);
 st.addEventListener('wheel',e=>{e.preventDefault();s3=Math.max(14,Math.min(120,s3*(e.deltaY<0?1.08:.93)));stage();},{passive:false});
 st.addEventListener('keydown',e=>{const k=e.key;
  if(k==='ArrowLeft'){ry-=6;pose();}else if(k==='ArrowRight'){ry+=6;pose();}
  else if(k==='ArrowUp'){rx=Math.max(-85,rx-5);pose();}else if(k==='ArrowDown'){rx=Math.min(85,rx+5);pose();}
  else if(k==='PageUp'||k==='+'||k==='='){s3=Math.min(120,s3*1.1);stage();}
  else if(k==='PageDown'||k==='-'||k==='_'){s3=Math.max(14,s3/1.1);stage();}
  else if(k==='0'||k==='Home'){rx=-14;ry=-28;if(pf)s3=Math.min(60,Math.floor(300/pf.trim_h_in));stage();}
  else return;e.preventDefault();});
})();
boot();
</script>
</body>
</html>
