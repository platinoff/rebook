<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title data-uk="Продукти — rebook" data-en="Products — rebook">Продукти — rebook</title>
<link rel="stylesheet" href="/styles.css"/>
<style>
 .card{background:#1b1e27;border:1px solid #2f3542;border-left:4px solid #7aa2f7;border-radius:10px;padding:1em 1.2em;margin:1em 0;}
 .badge{display:inline-block;margin:.25em .4em .25em 0;padding:.2em .7em;border-radius:6px;font-size:.85em;border:1px solid #2e9e44;color:#2e9e44;}
 .badge.gate{border-color:#7aa2f7;color:#7aa2f7;cursor:pointer;}
 .badge.bad{border-color:#f85149;color:#f85149;}
 .a{color:#7aa2f7;text-decoration:none;}
 .meta{color:#9aa0ac;font-size:.9em;}
 .gateout{margin-top:.5em;padding:.6em;background:#12141a;border-radius:8px;font-family:monospace;font-size:.85em;display:none;white-space:pre-wrap;}
</style>
</head>
<body>
<!--rbnav-->
<div id="products-app">
<header>
<h1 data-uk="Продукти (Shelf)" data-en="Products (Shelf)">Продукти (Shelf)</h1>
<p class="author"><span data-uk="Зібрано cargo run -- shelf; перевірка воріт — /api/print/check." data-en="Built with cargo run -- shelf; gate check — /api/print/check.">Зібрано <code>cargo run -- shelf</code>; перевірка воріт — <code>/api/print/check</code>.</span>
 <span class="badge" id="langChip" style="margin-left:1em;cursor:pointer">EN</span></p>
<p class="meta" data-uk="Зібрано cargo run -- shelf; перевірка воріт — /api/print/check." data-en="Built with cargo run -- shelf; gate check — /api/print/check.">Зібрано <code>cargo run -- shelf</code>; перевірка воріт — <code>/api/print/check</code>.</p>
</header>
<div id="list">…</div>
</div>
<script>
const $=s=>document.querySelector(s);
(function(){
 let lang=localStorage.getItem('rb.lang')||'uk';
 function apply(){
  lang=localStorage.getItem('rb.lang')||'uk';
  document.documentElement.lang=lang;
  document.title=lang==='en'?'Products — rebook':'Продукти — rebook';
  const c=document.getElementById('langChip');if(c)c.textContent=lang==='uk'?'EN':'УК';
 }
 document.getElementById('langChip').onclick=()=>{
  const next=lang==='uk'?'en':'uk';
  if(window.rbSetLang)window.rbSetLang(next);else{localStorage.setItem('rb.lang',next);apply();}
 };
 document.addEventListener('rb-lang',apply);
 apply();
 window._rbEmpty=()=> (localStorage.getItem('rb.lang')==='en')
  ?'No built products yet. Add formats in product.json and run cargo run -- shelf.'
  :'Немає зібраних продуктів. Додай formats у product.json і запусти cargo run -- shelf.';
 window._rbGate=(n)=> (localStorage.getItem('rb.lang')==='en')
  ? (n==null?'KDP gate: check':n)
  : (n==null?'KDP-ворота: перевірити':n);
})();
async function boot(){
 let items=[];try{items=await (await fetch('/api/products')).json();}catch(e){}
 const empty=window._rbEmpty();
 $('#list').innerHTML=items.length?items.map(p=>{
  const fmts=[];
  if(p.has_ebook)fmts.push('<a class="badge" href="/api/products/download/'+p.slug+'/'+p.slug+'.epub" download>eBook EPUB ↓</a>');
  for(const k of p.packages){
   fmts.push('<span class="badge">'+k.format+' · '+k.trim+' · '+k.pages+' p</span>');
   if(k.zip)fmts.push('<a class="badge" href="/api/products/download/'+p.slug+'/'+k.zip+'" download>zip ↓</a>');
   fmts.push('<span class="badge gate" data-s="'+p.slug+'" data-f="'+k.format+'">'+(window._rbGate())+'</span>');
   fmts.push('<div class="gateout" id="g-'+p.slug+'-'+k.format+'"></div>');
  }
  return '<div class="card rb-box"><h3>'+p.slug+'</h3>'+fmts.join(' ')+'</div>';
 }).join(''):'<p>'+empty+'</p>';
 document.querySelectorAll('.badge.gate').forEach(b=>b.onclick=async()=>{
  if(!b.dataset.s)return;
  const out=$('#g-'+b.dataset.s+'-'+b.dataset.f);out.style.display='block';out.textContent='…';
  const r=await fetch('/api/print/check/'+b.dataset.s+'/'+b.dataset.f);
  const items=await r.json();
  const bad=items.filter(i=>!i.ok);
  out.textContent=items.map(i=>(i.ok?'✓ ':'✗ ')+i.name+' · '+i.detail).join('\n');
  b.className='badge '+(r.ok&&bad.length===0?'':'bad');
  const en=localStorage.getItem('rb.lang')==='en';
  b.textContent=(en?'KDP gate: ':'KDP-ворота: ')+(r.ok&&bad.length===0?'GREEN':(r.ok?bad.length+' FAIL':(en?'error':'помилка')));
 });
}
boot();
</script>
</body>
</html>
