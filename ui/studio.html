<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Studio — rebook</title>
<style>
 :root{--bg:#12141a;--panel:#1b1e27;--line:#2f3542;--txt:#e6e6e6;--mut:#9aa0ac;--acc:#7aa2f7;--ok:#3fb950;--warn:#d29922;--bad:#f85149}
 body.light{--bg:#f5f5f4;--panel:#fff;--line:#d8d4cd;--txt:#1f2328;--mut:#6b6b66;--acc:#3b6fd0;--ok:#1a7f37;--warn:#9a6700;--bad:#c62828}
 *{box-sizing:border-box}
 html,body{margin:0;background:var(--bg);color:var(--txt);font:14px/1.5 system-ui,Segoe UI,Roboto,sans-serif;height:100%}
 body{display:flex;flex-direction:column}
 header{display:flex;gap:.7em;align-items:center;padding:.55em 1em;border-bottom:1px solid var(--line);background:var(--panel);flex-wrap:wrap}
 header h1{font-size:1.05em;margin:0;color:var(--acc)}
 a{color:var(--acc);text-decoration:none}
 .grow{flex:1}
 .pill{border:1px solid var(--line);border-radius:999px;padding:.18em .8em;font-size:.85em;color:var(--mut)}
 .pill.saving{border-color:var(--warn);color:var(--warn)}
 .pill.saved{border-color:var(--ok);color:var(--ok)}
 .pill.failed{border-color:var(--bad);color:var(--bad);cursor:pointer}
 .chip{cursor:pointer;user-select:none}
 #goals{display:flex;gap:.9em;align-items:center;font-size:.85em;color:var(--mut)}
 #goals input{width:5.5em;background:var(--bg);color:var(--txt);border:1px solid var(--line);border-radius:6px;padding:.2em .4em}
 #studio-app{display:flex;flex-direction:column;flex:1;min-height:0}
 main{display:grid;grid-template-columns:250px 1fr 420px;gap:0;flex:1;min-height:0}
 body.zen main{grid-template-columns:1fr}
 body.zen .rail,body.zen #prevPane,body.zen header #goals,body.zen .bar{display:none}
 body.zen{background:var(--bg)}
 body.zen textarea#md{max-width:38em;margin:0 auto;min-height:100vh;padding-top:30vh;font-size:calc(17px*var(--z,1))}
 body.norail main{grid-template-columns:1fr 420px}
 body.noprev main{grid-template-columns:250px 1fr}
 body.norail.noprev main{grid-template-columns:1fr}
 aside{border-left:1px solid var(--line);overflow:auto;background:var(--bg)}
 aside.rail{border-left:0;border-right:1px solid var(--line);padding:.6em;background:var(--panel)}
 #chapList{list-style:none;margin:.4em 0;padding:0}
 #chapList li{display:flex;gap:.4em;align-items:center;padding:.35em .4em;border-radius:8px;cursor:pointer;font-size:.92em}
 #chapList li:hover{background:var(--bg)}
 #chapList li.sel{background:#123;outline:1px solid var(--acc)}
 body.light #chapList li.sel{background:#e8f0fe}
  #chapList li.drag{opacity:.35}
  #chapList li:focus-visible{outline:2px solid var(--acc);outline-offset:-2px}
  #chapList li .grip{color:var(--mut);cursor:grab;letter-spacing:-2px;touch-action:none;padding:0 .2em}
 #chapList li .ttl{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
 #chapList li .wc{color:var(--mut);font-size:.8em}
 #chapList li .del{visibility:hidden;color:var(--bad)}
 #chapList li:hover .del{visibility:visible}
 .railhead{display:flex;align-items:center;gap:.4em}
 .btn{background:var(--acc);border:0;color:#0b1020;border-radius:6px;padding:.3em .8em;font-weight:600;cursor:pointer}
 .btn.ghost{background:transparent;color:var(--acc);border:1px solid var(--acc)}
 .bar{display:flex;gap:.25em;padding:.45em .6em;border-bottom:1px solid var(--line);background:var(--panel);flex-wrap:wrap;position:sticky;top:0;z-index:2}
 .bar button{background:none;border:1px solid transparent;border-radius:6px;color:var(--txt);font:600 13px/1 ui-monospace,Consolas,monospace;padding:.35em .55em;cursor:pointer}
 .bar button:hover{border-color:var(--line);background:var(--bg)}
 .bar .sep{width:1px;background:var(--line);margin:.3em .25em}
 #titleIn{flex:1;min-width:8em;background:none;border:0;color:var(--txt);font:600 15px/1.4 system-ui;outline:none;padding:.35em .3em}
  textarea#md{width:100%;border:0;outline:none;resize:none;background:var(--bg);color:var(--txt);
   font-family:Georgia,serif;font-size:calc(15px*var(--z,1));line-height:1.75;padding:1.6em 2em;min-height:calc(100vh - 98px)}
 textarea#md:focus{outline:none}
 .editwrap{overflow:auto;height:100%}
  #prev{padding:1.4em 1.8em;font-family:Georgia,serif;font-size:calc(14px*var(--z,1));color:var(--txt)}
 #prev h2{font-size:1.35em;margin:.1em 0 .8em;letter-spacing:.02em}
 #prev p{margin:.7em 0;text-align:justify;max-width:62ch}
 #prev blockquote{margin:.9em 0;padding:.1em 0 .1em 1.1em;border-left:3px solid var(--acc);font-style:italic;color:var(--mut)}
 #prev pre{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:.7em;font-size:.85em;overflow:auto}
 .muted{color:var(--mut)}
  .stat{display:flex;gap:.7em;align-items:center;padding:.35em .8em;border-top:1px solid var(--line);font-size:.8em;color:var(--mut);background:var(--panel);flex:none;user-select:none}
  .stat .sep{width:1px;height:1.3em;background:var(--line)}
  .stat button{background:none;border:1px solid transparent;border-radius:4px;color:var(--mut);font:inherit;padding:0 .4em;cursor:pointer}
  .stat button:hover{border-color:var(--line);color:var(--txt)}
  #stPos{font-family:ui-monospace,Consolas,monospace;min-width:4.5em}
  #pv{overflow:auto;height:100%;display:flex;flex-direction:column;align-items:center;gap:1.1em;padding:.8em;background:#0a0c11}
  #pv[hidden]{display:none}
  #prev[hidden]{display:none}
  body.light #pv{background:#dedbd4}
  .sp{display:flex;box-shadow:0 12px 44px rgba(0,0,0,.6)}
  .pvw{position:relative;overflow:hidden;background:#fff}
  .pvw+.pvw{box-shadow:inset 10px 0 14px -10px rgba(0,0,0,.3),inset -1px 0 0 #d8d5cc}
  .pvf{position:absolute;font-family:Georgia,serif;color:#191919;text-align:justify;line-height:1.35;hyphens:auto}
  .pvf p{margin:0;text-align:justify}
  .pvw .pgn{position:absolute;bottom:.5em;width:100%;text-align:center;color:#9a968d;font:12px Georgia,serif}
  /* page view mirrors src/interior.rs: 12pt body, lh 1.35, margin=max(gutter,0.375)+0.25in, chapter page 30/22pt */
  #pgcalc{position:fixed;left:-99999px;top:0;visibility:hidden;width:400px}
  .pv-flow{font-family:Georgia,serif;color:#191919;font-size:16px;line-height:1.35;hyphens:auto}
  .pv-flow p{margin:0;text-align:justify}
  .pv-flow .muted{color:#5a5a55}
  .pv-flow h2{font-size:24px;margin:2px 0 16px}
  .pv-flow h3{font-size:20px;margin:2px 0 14px}
  .pv-flow pre{background:#f2f0ea;color:#222;border-radius:0;padding:.5em;font-size:12px;line-height:1.3;margin:0;white-space:pre-wrap}
  .pv-flow blockquote{border-left:2px solid #bbb;margin:6px 0;padding:2px 0 2px 14px;color:#444;font-style:italic}
  .pvw{position:relative;overflow:hidden;background:#fffdf8}
  .pvf{position:absolute;column-fill:auto;column-gap:0}
  .pv-book{display:flex;align-items:stretch;background:#5b4636;border-radius:6px;box-shadow:0 10px 30px rgba(0,0,0,.55)}
  .pv-spine{width:10px;align-self:stretch;background:linear-gradient(90deg,#00000055,#00000022,#00000055)}
 #sheet{position:fixed;inset:0;background:rgba(5,8,14,.65);display:none;align-items:center;justify-content:center;z-index:9}
 #sheet.on{display:flex}
 #sheet .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:1.2em 1.6em;max-width:640px;max-height:80vh;overflow:auto}
 #sheet h3{margin:.2em 0 .8em}
 #sheet table{border-collapse:collapse;font-size:.9em}
 #sheet td{padding:.25em .8em .25em 0;color:var(--txt)}
 #sheet td.k{color:var(--acc);font-family:ui-monospace,Consolas,monospace;white-space:nowrap}
</style>
</head>
<body>
<!--rbnav-->
<div id="studio-app">
<header>
 <h1 data-i18n="app">Studio — чернетки</h1>
 <span class="pill" id="pill" data-i18n-idle="Готово">…</span>
 <span id="goals">
   <span data-i18n="target">ціль</span> <input id="gTarget" type="number" min="0" step="100" value="0"/>
   · <span id="gToday">0</span> <span data-i18n="today">сьогодні</span>
   · <span id="gStreak">🔥 0</span>
 </span>
  <span class="grow"></span>
  <span class="pill chip" id="langChip">EN</span>
 <span class="pill chip" id="themeChip">◐</span>
 <span class="pill chip" id="helpChip" title="?">?</span>
</header>
<main>
 <aside class="rail">
  <div class="railhead"><button class="btn" id="addChap" data-i18n="new">＋ розділ</button>
   <span class="grow"></span><span class="muted" id="bookWords"></span></div>
  <ul id="chapList"></ul>
  <details id="metaPanel" style="margin-top:.8em;border-top:1px solid var(--line);padding-top:.6em">
   <summary style="cursor:pointer;color:var(--acc);font-size:.9em" data-i18n="meta">⚙ Мета книги</summary>
   <label class="muted" style="display:block;font-size:.8em;margin-top:.5em" data-i18n="author">автор</label>
   <input id="mAuthor" style="width:100%;margin-top:.2em"/>
   <label class="muted" style="display:block;font-size:.8em;margin-top:.5em" data-i18n="lang">мова</label>
   <select id="mLang" style="width:100%;margin-top:.2em"><option value="uk">uk — українська</option><option value="en">en — English</option></select>
   <label class="muted" style="display:block;font-size:.8em;margin-top:.5em" data-i18n="cover">обкладинка</label>
   <input id="mCover" type="file" accept="image/png,image/jpeg" style="width:100%;margin-top:.2em;font-size:.8em"/>
   <img id="mThumb" alt="" style="display:none;max-width:100%;margin-top:.4em;border-radius:6px;border:1px solid var(--line)"/>
   <label class="muted" style="display:block;font-size:.8em;margin-top:.5em" data-i18n="formats">формати</label>
   <div id="mFormats" style="display:flex;gap:.7em;margin-top:.3em;font-size:.85em">
    <label><input type="checkbox" value="ebook"/> ebook</label>
    <label><input type="checkbox" value="paperback"/> pb</label>
    <label><input type="checkbox" value="hardcover"/> hc</label>
   </div>
   <div style="display:flex;gap:.4em;flex-wrap:wrap;margin-top:.7em">
    <button class="btn" id="mSave" data-i18n="msave">Зберегти</button>
    <button class="btn ghost" id="mBuild" data-i18n="mbuild">📦 Build products</button>
   </div>
   <div id="mBuildOut" class="muted" style="font-size:.75em;margin-top:.4em;white-space:pre-wrap"></div>
   <button class="btn ghost" id="mDel" style="margin-top:.6em;color:var(--bad);border-color:var(--bad)" data-i18n="mdel">✕ Видалити чернетку</button>
  </details>
 </aside>
 <section>
  <div class="bar">
   <button data-act="h1" title="Alt+1">H1</button>
   <button data-act="h2" title="Alt+2">H2</button>
   <button data-act="h3" title="Alt+3">H3</button>
   <span class="sep"></span>
   <button data-act="b" title="Ctrl+B"><b>B</b></button>
   <button data-act="i" title="Ctrl+I"><i>I</i></button>
   <button data-act="e" title="Ctrl+E">&lt;/&gt;</button>
   <button data-act="q" title="Ctrl+Shift+Q">❝</button>
   <button data-act="k" title="Ctrl+K">🔗</button>
   <span class="sep"></span>
   <input id="titleIn" placeholder="— розділ —"/>
  </div>
  <div class="editwrap"><textarea id="md" spellcheck="false"></textarea>
   <div id="find" style="display:none;position:sticky;bottom:.5em;margin:0 1.2em;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:.5em .7em;z-index:3;gap:.4em;align-items:center">
    <input id="fq" placeholder="знайти…" style="flex:1;min-width:8em;background:var(--bg);color:var(--txt);border:1px solid var(--line);border-radius:6px;padding:.3em .5em"/>
    <input id="fr" placeholder="замінити…" style="flex:1;min-width:8em;background:var(--bg);color:var(--txt);border:1px solid var(--line);border-radius:6px;padding:.3em .5em"/>
    <span id="fcn" class="muted" style="min-width:5em"></span>
    <button class="btn ghost" id="fnext">↓</button><button class="btn ghost" id="fprev">↑</button>
    <button class="btn ghost" id="fone">→</button><button class="btn ghost" id="fall">⇒all</button>
    <button class="btn ghost" id="fx">✕</button>
   </div>
  </div>
 </section>
  <aside class="prev" id="prevPane"><div id="prev"></div><div id="pv" hidden></div></aside>
</main>
<div class="stat" id="sbar">
 <span id="stPos" title="поточна позиція курсора (рядок:колонка)">—</span>
 <button id="sTop" title="на початок розділу">⇱</button><button id="sEnd" title="на кінець розділу">⇲</button>
 <span class="sep"></span>
 <span id="stLeft" title="слів у розділі"></span>
 <span id="stChars" title="символів у розділі"></span>
 <span id="stChap" title="розділ N"></span>
 <span class="sep"></span>
 <span id="stPages" title="оцінка сторінок: слів ÷ 300 (WORDS_PER_PAGE зі shelf.rs)"></span>
 <span class="grow" style="flex:1"></span>
 <button id="pvFirst" title="перша сторінка (Home)">⏮</button><button id="pvPrev" title="← / PgUp: попередня сторінка">◀</button>
 <input id="pvNo" type="number" min="1" value="1" title="№ сторінки — Enter для переходу" style="width:4.5em;background:var(--bg);color:var(--txt);border:1px solid var(--line);border-radius:5px;padding:.1em .3em;font:inherit"/>
 <span id="pvOf" class="muted">/ 1</span>
 <button id="pvNext" title="→ / PgDn: наступна сторінка">▶</button><button id="pvLast" title="остання сторінка (End)">⏭</button>
 <label class="muted" style="display:flex;gap:.25em;align-items:center;cursor:pointer" title="розгортка книги: 2 сторінки поруч (spread)"><input id="pvSpread" type="checkbox" style="width:auto"/>spread</label>
 <button id="pvView" class="pill" title="V — режим: стрічка / сторінки (як у PDF ±1)">стрічка</button>
 <span class="sep"></span>
 <span id="stRight" title="zoom — Ctrl+колесо/pinch або Ctrl+±"></span>
 <button id="zOut" title="Ctrl+−">−</button><button id="zReset" title="скинути zoom (Ctrl+0)" style="min-width:3.4em">100%</button><button id="zIn" title="Ctrl++">＋</button>
</div>
</div>
<div id="sheet"><div class="card"><h3 data-i18n="keys">Гарячі клавіші</h3><table id="keysT"></table><p class="muted">Esc — закрити</p></div></div>
<script>
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const LS=localStorage;
const L={
 uk:{app:'Studio — чернетки',shelf:'Полиця',cover:'Обкладинки',products:'Продукти',target:'ціль',today:'сьогодні',new:'＋ розділ',
  keys:'Гарячі клавіші',idle:'Готово',saving:'збереження…',saved:'Збережено',failed:'помилка — повторити',
  del:'Видалити розділ?', sure:'Перейменувати — Enter, скасувати — Esc', chap:'Розділ', renamed:'перейменовано', reordered:'порядок збережено',
  meta:'⚙ Мета книги', author:'автор', lang:'мова', cover:'обкладинка', formats:'формати (для Build products)',
  msave:'Зберегти', mbuild:'📦 Build products', mdel:'✕ Видалити чернетку'},
 en:{app:'Studio — drafts',shelf:'Shelf',cover:'Covers',products:'Products',target:'goal',today:'today',new:'＋ chapter',
  keys:'Keyboard shortcuts',idle:'Ready',saving:'saving…',saved:'Saved',failed:'failed — retry',
  del:'Delete this chapter?', sure:'Rename — Enter, Esc cancels', chap:'Chapter', renamed:'renamed', reordered:'order saved',
  meta:'⚙ Book meta', author:'author', lang:'language', cover:'cover', formats:'formats (for Build products)',
  msave:'Save', mbuild:'📦 Build products', mdel:'✕ Delete draft'}
};
let lang=LS.getItem('rb.lang')||'uk';
function T(k){return (L[lang]&&L[lang][k])||L.uk[k]||k;}
function applyI18n(){document.documentElement.lang=lang==='uk'?'uk':'en';
 $$('.bar input'); $$('[data-i18n]').forEach(e=>{const k=e.dataset.i18n;if(L[lang][k]!==undefined)e.textContent=L[lang][k];});
 $('#langChip').textContent=lang==='uk'?'EN':'УК';}
/* state */
let drafts=[],cur=null,chaps=[],curNum=0,lastWords=0,dirty=false;
async function j(u,o){const r=await fetch(u,o);if(!r.ok)throw new Error(await r.text());return r.json().catch(()=>({}));}
/* pill */
let pillTimer=null,pending=null;
function pill(state){const p=$('#pill');p.className='pill '+state;
 p.textContent=state==='saving'?T('saving'):state==='saved'?T('saved'):state==='failed'?T('failed'):T('idle');}
$('#pill').onclick=()=>{if($('#pill').classList.contains('failed'))saveNow();};
/* drafts rail (simple list in left rail header area via chapList is chapters; drafts live in a select) */
async function boot(){
 await loadDrafts();
}
async function loadDrafts(){
 try{drafts=await j('/api/drafts');}catch(e){drafts=[];}
 const sel=$('#draftSel')||(function(){const s=document.createElement('select');s.id='draftSel';
  s.style.cssText='background:var(--bg);color:var(--txt);border:1px solid var(--line);border-radius:6px;padding:.3em';
  $('.railhead').prepend(s);return s;})();
 sel.innerHTML='<option value="">— чернетка —</option>'+drafts.map(d=>`<option value="${d.id}">${d.title}</option>`).join('');
 sel.onchange=()=>openDraft(sel.value);
 if(!cur&&drafts.length){sel.value=drafts[0].id;openDraft(drafts[0].id);}
}
async function openDraft(id){
 if(!id){cur=null;chaps=[];renderChaps();return;}
 const doc=await j('/api/drafts/'+id);
 cur=doc.meta; chaps=(doc.chapters||[]).map(c=>({...c,words:count(c.content||'')}));
  selectChapter(chaps.length?chaps[0].number:0);
  renderChaps();fillMeta(doc.meta);
}
function renderChaps(){
 const ul=$('#chapList');ul.innerHTML='';
 chaps.forEach((c,idx)=>{
  const li=document.createElement('li');li.tabIndex=0;li.dataset.n=c.number;
  li.innerHTML=`<span class="grip" title="тягни — порядок (миша/палець); Alt+↑↓ з клавіатури">⋮⋮</span><span class="ttl">${c.title||('— '+(idx+1)+' —')}</span><span class="wc">${c.words||0}</span><span class="del" title="${T('del')}">✕</span>`;
  li.querySelector('.ttl').ondblclick=e=>{e.stopPropagation();inlineRename(li,c);};
  li.querySelector('.del').onclick=async e=>{e.stopPropagation();if(!confirm(T('del')))return;
   try{chaps=(await j(`/api/drafts/${cur.id}/chapter/${c.number}`,{method:'DELETE'})).chapters;renderChaps();if(curNum===c.number)selectChapter(chaps[0]?chaps[0].number:0);}catch(err){pill('failed');}};
  li.onclick=()=>{if(li._d&&Date.now()-li._d<300)return;selectChapter(c.number);};
  li.onkeydown=e=>{
   if(e.key==='Enter'||e.key===' '){e.preventDefault();selectChapter(c.number);}
   else if(e.altKey&&(e.key==='ArrowUp'||e.key==='ArrowDown')){e.preventDefault();
    const sib=e.key==='ArrowUp'?li.previousElementSibling:li.nextElementSibling;if(!sib)return;
    e.key==='ArrowUp'?ul.insertBefore(li,sib):ul.insertBefore(li,sib.nextElementSibling);
    li.focus();saveOrder();}};
  li.querySelector('.grip').onpointerdown=e=>{e.preventDefault();e.stopPropagation();
   let dmoved=false;li.setPointerCapture(e.pointerId);li.classList.add('drag');
   const mv=ev=>{dmoved=true;
    const other=[...ul.children].filter(x=>x!==li);
    const after=other.find(x=>{const r=x.getBoundingClientRect();return ev.clientY<r.top+r.height/2;});
    if(after&&after!==li.nextElementSibling)ul.insertBefore(li,after);
    else if(!after&&li!==ul.lastElementChild)ul.appendChild(li);};
   const up=()=>{li.classList.remove('drag');if(dmoved)li._d=Date.now();
    li.removeEventListener('pointermove',mv);li.removeEventListener('pointerup',up);li.removeEventListener('pointercancel',up);
    saveOrder();};
   li.addEventListener('pointermove',mv);li.addEventListener('pointerup',up);li.addEventListener('pointercancel',up);};
  if(c.number===curNum)li.classList.add('sel');
  ul.appendChild(li);
 });
 $('#bookWords').textContent=chaps.reduce((a,c)=>a+(c.words||0),0)+' w';
}
async function saveOrder(){
 if(!cur)return;
 const ord=[...$('#chapList').children].map(li=>+li.dataset.n);
 if(ord.join()===chaps.map(c=>c.number).join())return;
 try{chaps=(await j(`/api/drafts/${cur.id}/reorder`,{method:'PUT',headers:{'content-type':'application/json'},body:JSON.stringify(ord)})).chapters;
  renderChaps();pill('saved');}catch(err){pill('failed');renderChaps();}
}
async function saveChapter(c){
 await j(`/api/drafts/${cur.id}/chapter/${c.number}`,{method:'PUT',headers:{'content-type':'application/json'},body:JSON.stringify({title:c.title,content:c.content})});
}
function inlineRename(li,c){
 const ttl=li.querySelector('.ttl');const old=c.title;
 ttl.innerHTML='<input style="width:100%;background:var(--bg);color:var(--txt);border:1px solid var(--acc);border-radius:4px"/>';
 const inp=ttl.querySelector('input');inp.value=old;inp.focus();inp.select();
 inp.onkeydown=async e=>{e.stopPropagation();
  if(e.key==='Enter'){inp.blur();}

}
/* meta panel (RB-26) */
function fillMeta(m){if(!m)return;$('#mAuthor').value=m.author||'';$('#mLang').value=(m.language==='en')?'en':'uk';
 $('#mFormats').querySelectorAll('input').forEach(cb=>{cb.checked=(m.formats||[]).includes(cb.value);});}
$('#mSave').onclick=async()=>{if(!cur)return;
 const formats=[...$('#mFormats').querySelectorAll('input:checked')].map(c=>c.value);
 try{const m=await j(`/api/drafts/${cur.id}/meta`,{method:'PUT',headers:{'content-type':'application/json'},
   body:JSON.stringify({author:$('#mAuthor').value,language:$('#mLang').value,formats})});
  cur=m;const ct=$('#curTitle');if(ct)ct.textContent=m.title+' ('+m.language+')';
  const f=$('#mCover').files[0];
  if(f){const rd=new FileReader();rd.onload=async()=>{try{await j(`/api/drafts/${cur.id}/cover-img`,{method:'POST',
    headers:{'content-type':'application/json'},body:JSON.stringify({data:rd.result})});
    $('#mThumb').src=rd.result;$('#mThumb').style.display='block';}catch(e){$('#mBuildOut').textContent='cover: '+e.message;}};
   rd.readAsDataURL(f);}
  pill('saved');await loadDrafts();}
 catch(e){pill('failed');}
};
$('#mBuild').onclick=async()=>{if(!cur){return;}$('#mBuildOut').textContent='building…';
 try{const files=await j(`/api/drafts/${cur.id}/build`,{method:'POST'});
  $('#mBuildOut').textContent=files.length?'✓ '+files.join('\n'):'(empty)';}
 catch(e){$('#mBuildOut').textContent='✗ '+e.message;}};
$('#mDel').onclick=async()=>{if(!cur||!confirm('Видалити чернетку?'))return;
 await fetch('/api/drafts/'+cur.id,{method:'DELETE'});cur=null;chaps=[];
 $('#editorbar').hidden=true;$('#editor').hidden=true;await loadDrafts();};

/* RB-23: focus (zen+typewriter), slash menu, quick-open */
let zen=false;
function toggleZen(){zen=!zen;document.body.classList.toggle('zen',zen);
 $('#metaPanel')&&($('#metaPanel').open=$('#metaPanel').open&&zen);if(zen)typeScroll();$('#md').focus();}
function typeScroll(){const ta=$('#md');if(!zen)return;const lh=parseFloat(getComputedStyle(ta).lineHeight)||24;
 const ln=(ta.value.slice(0,ta.selectionStart).match(/\n/g)||[]).length;
 ta.scrollTop=Math.max(0,ln*lh-ta.clientHeight/2);}
$('#md').addEventListener('keyup',typeScroll);$('#md').addEventListener('click',typeScroll);
/* slash menu */
const SLASH=[['chapter','новий розділ','## '],['break','розрив сторінки','\n---\n'],['quote','цитата','> '],['code','код-фенс','```\n','\n```'],['h2','заголовок','## '],['h3','підзаголовок','### '],['hr','розділювач','\n---\n'],['epigraph','епіграф','> '] ];
let slQ='',slOpen=false;
function slashUI(){let d=$('#slash');if(!d){d=document.createElement('div');d.id='slash';
  d.style.cssText='position:fixed;z-index:8;background:var(--panel);border:1px solid var(--line);border-radius:10px;min-width:220px;box-shadow:0 8px 30px rgba(0,0,0,.4)';
  document.body.appendChild(d);d.onclick=e=>{const it=e.target.closest('[data-i]');if(it)slashPick(+it.dataset.i);};}
 if(!slOpen){d.style.display='none';return;}
 const items=SLASH.filter(s=>s[0].startsWith(slQ));
 const ta=$('#md'),cr=ta.getBoundingClientRect();
 d.style.left=(cr.left+40)+'px';d.style.top=Math.min(innerHeight-220,cr.top+60)+'px';
 d.innerHTML=items.length?items.map((s,k)=>'<div data-i="'+SLASH.indexOf(s)+'" style="padding:.45em .8em;cursor:pointer'+(k===0?';background:var(--bg)':'')+'"><b>/'+s[0]+'</b> <span class="muted">'+s[1]+'</span></div>').join('')
  :'<div class="muted" style="padding:.5em .8em">—</div>';
 d.style.display='block';}
function slashInsert(txt){const ta=$('#md'),s=ta.selectionStart;ta.value=ta.value.slice(0,s)+txt+ta.value.slice(s);ta.focus();markDirty();paint();}
function slashPick(i){const s=SLASH[i];if(!s)return;slOpen=false;slQ='';slashUI();
 const ta=$('#md'),st=ta.selectionStart;
 // strip the typed "/query" at line start
 let ls=ta.value.lastIndexOf('\n',st-1)+1;const frag=ta.value.slice(ls,st);
 if(frag.startsWith('/')){ta.value=ta.value.slice(0,ls)+ta.value.slice(st);ta.setSelectionRange(ls,ls);}
 if(s[0]==='chapter'){if(cur)$('#addChap').click();}
 else if(s[2]&&s[3]!==undefined){slashInsert(s[2]+'\n'+s[3]);}
 else slashInsert(s[2]);}
$('#md').addEventListener('input',e=>{const ta=$('#md'),s=ta.selectionStart,ls=ta.value.lastIndexOf('\n',s-1)+1,frag=ta.value.slice(ls,s);
 const m=frag.match(/^\/([a-z0-9]*)$/);if(m){slOpen=true;slQ=m[1];}else{slOpen=false;}slashUI();});
/* quick-open */
function openQ(){let o=$('#qov');if(!o){o=document.createElement('div');o.id='qov';
  o.style.cssText='position:fixed;inset:0;background:rgba(5,8,14,.6);display:flex;align-items:flex-start;justify-content:center;z-index:9';
  o.innerHTML='<div style="margin-top:10vh;background:var(--panel);border:1px solid var(--line);border-radius:12px;width:min(560px,90vw)"><input id="qin" placeholder="розділ… (назва або №)" style="width:100%;box-sizing:border-box;background:none;border:0;outline:none;color:var(--txt);padding:.8em 1em;font:inherit"/><div id="qres" style="max-height:50vh;overflow:auto"></div></div>';
  document.body.appendChild(o);o.onclick=e=>{if(e.target===o)o.style.display='none';};
  $('#qin').oninput=e=>qRun(e.target.value);$('#qin').onkeydown=e=>{if(e.key==='Escape')o.style.display='none';if(e.key==='Enter'){const f=$('#qres .qhit');f&&f.click();}};}
 o.style.display='flex';$('#qin').value='';qRun('');$('#qin').focus();}
function qRun(q){const el=$('#qres');el.innerHTML='';if(!cur){return;}
 const items=chaps.filter(c=>!q||c.title.toLowerCase().includes(q.toLowerCase())||('#'+c.number).startsWith(q));
 el.innerHTML=items.slice(0,15).map(c=>'<div class="qhit" data-n="'+c.number+'" style="padding:.5em 1em;cursor:pointer;border-top:1px solid var(--line)"><b>№'+c.number+'</b> '+esc(c.title||'—')+'</div>').join('')||'<div class="muted" style="padding:.6em 1em">—</div>';
 el.querySelectorAll('.qhit').forEach(h=>h.onclick=()=>{const n=+h.dataset.n;$('#qov').style.display='none';selectChapter(n);});}
document.addEventListener('keydown',e=>{
 const mod=e.ctrlKey||e.metaKey;
 if(mod&&e.key.toLowerCase()==='p'&&!e.shiftKey){e.preventDefault();openQ();return;}
 if(e.key==='F9'||(mod&&e.shiftKey&&(e.key==='F11'||e.key==='f11'))){e.preventDefault();toggleZen();return;}
 if(slOpen&&['ArrowDown','ArrowUp','Enter','Escape'].includes(e.key)){
  const d=$('#slash');if(!d||d.style.display==='none')return;
  const its=[...d.querySelectorAll('[data-i]')];if(!its.length)return;
  let k=its.findIndex(x=>x.style.background!=='');if(k<0)k=0;
  if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();its[k].style.background='';
   const nk=(k+(e.key==='ArrowDown'?1:its.length-1))%its.length;its[nk].style.background='var(--bg)';}
  if(e.key==='Enter'){e.preventDefault();its[k].click();}
  if(e.key==='Escape'){slOpen=false;slashUI();}}});
/* init persisted toggles */
if(LS.getItem('rb.light'))document.body.classList.add('light');
if(LS.getItem('rb.norail'))document.body.classList.add('norail');
if(LS.getItem('rb.noprev'))document.body.classList.add('noprev');
applyI18n();zApply();pvApplyMode(pvMode!=='page');pill('');boot().then(showGoals);
</script>
</body>
